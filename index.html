<title>F&B Manpower</title>
<style>
:root{--blue:#2d7fe5;--blue2:#74c3ff;--navy:#153b6b;--ink:#18324f;--muted:#667b95;--line:#dce9f5;--gold:#c9a55f;--red:#d84e5b}
html,body{max-width:100%;overflow-x:hidden}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 8% 8%,rgba(116,195,255,.22),transparent 25%),radial-gradient(circle at 92% 10%,rgba(201,165,95,.13),transparent 20%),linear-gradient(180deg,#fff 0%,#f6faff 48%,#edf6ff 100%);min-height:100vh}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.header{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line)}
.header-inner{max-width:1180px;margin:auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}.brand img{width:52px;height:40px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:12px;padding:3px}.brand-title{font-weight:800;color:var(--navy);font-size:16px}.brand-sub{font-size:11px;color:var(--muted)}.header-spacer{flex:1}
.nav{display:flex;gap:6px;flex-wrap:wrap}.nav button{border:0;background:#f4f8fd;color:#55708d;padding:9px 12px;border-radius:11px;font-weight:700;font-size:12px}.nav button.active{background:linear-gradient(135deg,#e7f3ff,#d8eaff);color:#185391}
.page{max-width:1180px;margin:0 auto;padding:20px 16px 36px}
.hero{border:1px solid #d9e8f7;border-radius:26px;padding:24px;background:linear-gradient(135deg,#fff,#edf7ff 62%,#dceeff);box-shadow:0 18px 48px rgba(37,98,160,.10);position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:320px;height:220px;border:2px solid rgba(201,165,95,.18);border-radius:50%;right:-120px;bottom:-120px;transform:rotate(-18deg)}.eyebrow{font-size:11px;letter-spacing:.16em;color:#2c70b7;font-weight:800}.hero h1{margin:8px 0 4px;font-size:clamp(32px,6vw,54px);letter-spacing:-.03em;color:#143a69}.hero p{margin:0;color:#607792}
.section-title{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:24px 0 12px}.section-title h2{margin:0;color:#173e70;font-size:23px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 10px 28px rgba(48,104,164,.07);padding:18px}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.actions{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
.action{position:relative;min-height:150px;padding:18px;border:1px solid var(--line);background:linear-gradient(180deg,#fff,#f8fbff);border-radius:20px;box-shadow:0 10px 26px rgba(48,105,166,.07);display:flex;flex-direction:column;gap:10px;text-align:left}.action:hover{transform:translateY(-2px);box-shadow:0 18px 34px rgba(39,113,197,.13)}.icon{width:54px;height:54px;border-radius:17px;display:grid;place-items:center;background:linear-gradient(145deg,#eef7ff,#dceeff 62%,#f5ead5);border:1px solid #d8e8f7}.icon svg{width:28px;height:28px;fill:none;stroke:#235e9e;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.action b{color:#174878;font-size:15px}.small{font-size:12px;color:var(--muted)}
.hotel-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:18px}.hotel-btn{padding:0;position:relative;overflow:hidden;min-height:290px;border:1px solid #d4e4f3;border-radius:26px;background:#fff;box-shadow:0 18px 44px rgba(45,104,163,.10);text-align:left}.hotel-btn:before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:linear-gradient(90deg,#8cd2ff,#2d7fe5,#c9a55f)}.hotel-btn:hover{transform:translateY(-5px);box-shadow:0 25px 50px rgba(44,119,208,.16)}.hotel-art{height:205px;background:linear-gradient(180deg,#fbfdff,#eef6ff);display:grid;place-items:center;padding:22px}.hotel-art img{max-width:90%;max-height:170px;object-fit:contain}.hotel-copy{padding:14px 18px 18px}.hotel-copy b{font-size:18px;color:#1b4b7e}.hotel-copy span{display:block;color:#70849b;font-size:12px;margin-top:4px}.hotel-arrow{position:absolute;right:16px;bottom:17px;width:44px;height:44px;border-radius:50%;background:#fff;border:1px solid var(--line);display:grid;place-items:center;color:#2a6db3;font-size:21px;box-shadow:0 7px 16px rgba(0,0,0,.08)}
label{display:block;font-weight:700;font-size:13px;color:#355b7e;margin-bottom:6px}input,select,textarea{width:100%;padding:11px 12px;border-radius:11px;border:1px solid #d7e6f3;background:#fff;color:#264561;outline:none}textarea{min-height:90px;resize:vertical}input:focus,select:focus,textarea:focus{border-color:#5fa7eb;box-shadow:0 0 0 4px rgba(95,167,235,.14)}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:800}.btn-primary{color:#fff;background:linear-gradient(110deg,#77c4ff,#378be7 48%,#2b6fd0 80%,#c9a55f);box-shadow:0 10px 22px rgba(48,121,210,.18)}.btn-light{color:#315b82;background:#fff;border:1px solid var(--line)}.btn-danger{color:#fff;background:var(--red)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800}.pill-blue{background:#e8f3ff;color:#24639f}.pill-gold{background:#f7efde;color:#896b31}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.kpi{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px}.kpi .l{font-size:12px;color:#70859b}.kpi .v{font-size:28px;font-weight:800;color:#194c82;margin-top:3px}
table{width:100%;border-collapse:separate;border-spacing:0;overflow:hidden}th{background:linear-gradient(135deg,#173d6d,#2f78d8);color:#fff;padding:12px;font-size:12px;text-align:left}td{padding:11px 12px;border-bottom:1px solid #e7eef6;font-size:12px;color:#2b4a66;background:#fff}tr:nth-child(even) td{background:#fbfdff}
.cloud-status{font-size:11px;font-weight:800;padding:6px 9px;border-radius:999px;background:#fff8e8;color:#a66a00;white-space:nowrap}.cloud-status.online{background:#eaf8ef;color:#18864b}.cloud-status.offline{background:#fff0f0;color:#b42318}.cloud-status.connecting{background:#fff8e8;color:#a66a00}@media(max-width:700px){.cloud-status{font-size:10px;padding:5px 7px}.btn{min-height:44px}}
.toast{position:fixed;right:16px;bottom:18px;z-index:80;background:#173e70;color:#fff;padding:12px 16px;border-radius:12px;box-shadow:0 14px 32px rgba(0,0,0,.18);display:none;max-width:90vw}.toast.show{display:block}.empty{padding:30px;text-align:center;color:#7b8da2}.footer-note{margin-top:18px;text-align:center;font-size:11px;color:#7b8ea3}
@media(max-width:900px){.actions{grid-template-columns:repeat(2,minmax(0,1fr))}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.header-inner{padding:8px 10px;gap:7px;flex-wrap:wrap}.nav{display:none}.page{padding:12px 10px 28px}.hotel-grid,.grid-2,.actions,.kpis{grid-template-columns:1fr}.hotel-btn{min-height:245px}.hotel-art{height:175px}.hotel-art img{max-height:145px}.hero{padding:18px;border-radius:22px}.brand{flex:1 1 108px;min-width:108px;gap:7px}.brand img{width:42px;height:36px;border-radius:10px;padding:2px}.brand-title{font-size:13px;line-height:1.05;white-space:nowrap}.brand-sub{display:none}.session-bar{flex:0 0 auto;gap:6px}.user-badge{max-width:76px;padding:7px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.session-bar .btn{min-height:44px;padding:8px 10px;white-space:nowrap}}

/* V21 Login / Role / Permission */
.login-shell{min-height:100svh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 15% 15%,rgba(116,195,255,.30),transparent 30%),radial-gradient(circle at 85% 20%,rgba(245,215,150,.24),transparent 30%),linear-gradient(135deg,#f7fbff 0%,#eef7ff 48%,#fffaf1 100%)}
.login-card{width:min(1040px,100%);display:grid;grid-template-columns:1.15fr .85fr;gap:0;overflow:hidden;border:1px solid rgba(145,182,214,.28);border-radius:30px;background:rgba(255,255,255,.88);box-shadow:0 24px 70px rgba(35,86,128,.16);backdrop-filter:blur(12px)}

.login-logos{display:flex;gap:12px;flex-wrap:wrap}.login-logo{height:62px;padding:8px 14px;border-radius:18px;background:#fff;border:1px solid rgba(145,182,214,.24);display:flex;align-items:center;box-shadow:0 8px 24px rgba(35,86,128,.08)}.login-logo img{max-height:46px;max-width:150px;object-fit:contain}

.login-form{padding:42px;background:#fff}.login-form h2{margin:0;color:#173d69;font-size:28px}.login-form .sub{color:#71879c;margin:8px 0 22px}.login-user{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid #dbe9f3;border-radius:16px;background:#f8fbfe;margin-bottom:14px}.login-avatar{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#247bd5,#6cc4ff);color:#fff;font-weight:900}.login-form label{font-weight:700}.login-form input{width:100%;box-sizing:border-box}.login-error{display:none;margin:10px 0;padding:11px 13px;border-radius:12px;background:#fff1f1;border:1px solid #ffd3d3;color:#a33;font-size:13px}.demo-accounts{margin-top:22px;padding-top:18px;border-top:1px solid #e9f0f5}.demo-accounts-title{font-weight:800;color:#355777;margin-bottom:10px}.demo-account-list{display:grid;gap:8px}.demo-account{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border:1px solid #e4edf4;border-radius:12px;padding:9px 10px;background:#fbfdff}.demo-account small{color:#68809a}.demo-account button{white-space:nowrap}
.user-badge{display:flex;align-items:center;gap:8px;padding:8px 11px;border-radius:999px;background:#eef7ff;border:1px solid #d9ebf8;color:#28547a;font-size:12px}.user-badge strong{color:#163f70}.session-bar{display:flex;align-items:center;gap:8px}
.permission-lock{padding:24px;border-radius:20px;border:1px dashed #c9d9e6;background:#fbfdff;text-align:center;color:#60778d}.permission-lock .big{font-size:34px;margin-bottom:6px}.role-pill{font-size:11px;border-radius:999px;padding:4px 8px;background:#edf6ff;color:#29618e;border:1px solid #d7eaf8}
.audit-list{display:grid;gap:8px;margin-top:12px;max-height:360px;overflow:auto}.audit-row{padding:10px 12px;border:1px solid #e4edf4;border-radius:12px;background:#fbfdff}.audit-row b{color:#244e74}.audit-row .small{margin-top:3px}
@media(max-width:860px){.login-card{grid-template-columns:1fr}.login-brand{padding:28px}.login-form{padding:28px}.login-points{grid-template-columns:1fr}.login-brand h1{font-size:44px}}
@media(max-width:560px){.login-shell{padding:12px}.login-card{border-radius:22px}.login-brand,.login-form{padding:20px}.login-logo{height:54px}.login-logo img{max-height:39px;max-width:125px}}


.login-card-simple{max-width:760px!important;grid-template-columns:1fr 1fr!important;align-items:stretch!important}

@media (max-width:720px){.login-card-simple{grid-template-columns:1fr!important;max-width:460px!important}.login-brand-simple{padding:24px 20px 10px!important}.login-brand-simple h1{font-size:26px!important}.login-form-simple{padding:24px 20px 28px!important}}
</style>

<style id="workflow-v5-css">

// Migrate legacy daily statuses out of Employee Master into separate attendance records.
function migrateLegacyAttendance(){
  DATA.attendance=DATA.attendance||{};
  DATA.employees.forEach(e=>{
    const legacy=e.statusByDate||{};
    Object.entries(legacy).forEach(([date,rec])=>{
      const k=attendanceKey(e.id,date);
      if(!DATA.attendance[k]) DATA.attendance[k]={id:`ATT-${e.id}-${date}`,employeeId:e.id,date,...(typeof rec==="object"?rec:{status:rec}),updatedAt:Number(e.updatedAt||e.createdAt||Date.now())};
    });
    delete e.statusByDate;
  });
  localSave("baiyoke_fnb_manpower_attendance_v1",DATA.attendance);
}
migrateLegacyAttendance();

function newRecordId(prefix){
 const rnd=(crypto?.randomUUID?.()||(`${Date.now()}-${Math.random().toString(36).slice(2,10)}`));
 return `${prefix}-${rnd}`;
}
function newRequestId(dateStr){
 const date=(dateStr||todayISO()).replace(/-/g,"");
 const prefix=`REQ-${date}-`;
 const used=(Array.isArray(DATA.requests)?DATA.requests:[])
  .map(r=>String(r?.id||""))
  .map(id=>{const m=id.match(new RegExp(`^${prefix}(\\d+)$`));return m?Number(m[1]):0})
  .filter(Number.isFinite);
 const next=(used.length?Math.max(...used):0)+1;
 return `${prefix}${String(next).padStart(3,'0')}`;
}
function cloudId(x){
 if(x?.id)return String(x.id);
 if(x?.requestId&&x?.code)return `MV-${x.requestId}-${x.code}-${x.date||''}-${x.start||''}-${x.end||''}`;
 if(x?.code)return `REC-${x.code}-${x.date||''}-${x.start||''}-${x.end||''}-${x.type||''}`;
 return String(x?.id||newRecordId('REC'));
}
function cloudFingerprint(x){

}

function markCloudChanges(bucket,arr){

async function cloudSyncAttendance(){
 if(!navigator.onLine){CLOUD_OK=false;cloudSetStatus("offline","อุปกรณ์ออฟไลน์");return false;}
 if(CLOUD_BUSY.attendance)return true;
 CLOUD_BUSY.attendance=true;
 try{
   cloudSetStatus("connecting");
   const rows=await cloudFetch("attendance");
   const remote=new Map(rows.map(r=>[String(r.item_id),{payload:r.payload,updated_at:r.updated_at}]));
   const local=attendanceLocalMap();
   remote.forEach((r,id)=>{
     const l=local.get(id);
     if(!l){local.set(id,r.payload);return;}
     const rt=Date.parse(r.updated_at||"")||Number(r.payload?.updatedAt||r.payload?.createdAt||0);
     const lt=Number(l.updatedAt||l.createdAt||0);
     if(rt>lt)local.set(id,r.payload);
   });
   DATA.attendance={};
   local.forEach((x)=>{const k=attendanceKey(x.employeeId,x.date);DATA.attendance[k]=x;});
   const merged=attendanceItems();
   const needPush=merged.filter(x=>{
     const id=String(x.id||`ATT-${x.employeeId}-${x.date}`),rr=remote.get(id);
     if(!rr)return true;
     const rt=Date.parse(rr.updated_at||"")||Number(rr.payload?.updatedAt||rr.payload?.createdAt||0);
     return Number(x.updatedAt||x.createdAt||0)>rt;
   });
   if(needPush.length)await cloudUpsert("attendance",needPush);
   localSave("baiyoke_fnb_manpower_attendance_v1",DATA.attendance);
   CLOUD_STATE.lastSync=Date.now();CLOUD_OK=true;cloudSetStatus("online");return true;
 }catch(e){
   CLOUD_OK=false;CLOUD_STATE.error=String(e?.message||e);cloudSetStatus("offline",CLOUD_STATE.error);console.warn("[F&B Manpower Cloud] attendance",e);return false;
 }finally{CLOUD_BUSY.attendance=false;}
}

async function cloudFetch(bucket){
 const u=FNB_CLOUD.url+'/rest/v1/'+FNB_CLOUD.table+
   '?select=item_id,payload,updated_at&bucket=eq.'+encodeURIComponent(bucket);
 const r=await fetch(u,{headers:cloudHeaders(),cache:'no-store'});
 const tx=await r.text();
 if(!r.ok)throw new Error('Cloud read '+r.status+' '+tx.slice(0,220));
 try{return JSON.parse(tx)||[]}catch(e){throw new Error('Cloud read invalid JSON')}
}
async function cloudUpsert(bucket,items){
 if(!items.length)return;
 const rows=items.map(x=>({
   bucket,item_id:cloudId(x),payload:(bucket==="employees"?(()=>{const y={...x};delete y.statusByDate;return y})():x),
   updated_at:new Date(Number(x.updatedAt||x.createdAt||Date.now())).toISOString()
 }));
 const u=FNB_CLOUD.url+'/rest/v1/'+FNB_CLOUD.table+'?on_conflict=bucket,item_id';
 const r=await fetch(u,{
   method:'POST',headers:cloudHeaders(true),body:JSON.stringify(rows),
   cache:'no-store'
 });
 const tx=await r.text();
 if(!r.ok)throw new Error('Cloud write '+r.status+' '+tx.slice(0,260));
}
async function cloudSyncBucket(bucket){
 if(!navigator.onLine){
   CLOUD_OK=false;
   cloudSetStatus('offline','อุปกรณ์ออฟไลน์');
   return false;
 }
 if(CLOUD_BUSY[bucket])return true;
 CLOUD_BUSY[bucket]=true;
 try{
   cloudSetStatus('connecting');
   const rows=await cloudFetch(bucket);
   const remote=new Map(rows.map(r=>[String(r.item_id),{
     payload:r.payload,updated_at:r.updated_at
   }]));
   let arr=bucket==='requests'?DATA.requests:bucket==='movements'?DATA.movements:bucket==='ots'?DATA.ots:bucket==='employees'?DATA.employees:DATA.otRequests;
   const local=new Map(arr.map(x=>[cloudId(x),x]));

   remote.forEach((r,id)=>{
     const l=local.get(id);
     if(!l){local.set(id,r.payload);return}
     const rt=Date.parse(r.updated_at||'')||Number(r.payload?.updatedAt||r.payload?.createdAt||0);
     const lt=Number(l.updatedAt||l.createdAt||0);
     if(rt>lt)local.set(id,r.payload);
   });

   const merged=Array.from(local.values());
   if(bucket==='requests')DATA.requests=merged;
   else if(bucket==='movements')DATA.movements=merged;
   else if(bucket==='ots')DATA.ots=merged;
   else if(bucket==='employees')DATA.employees=merged; else DATA.otRequests=merged;

   const needPush=merged.filter(x=>{
     const id=cloudId(x), rr=remote.get(id);
     if(!rr)return true;
     const rt=Date.parse(rr.updated_at||'')||Number(rr.payload?.updatedAt||rr.payload?.createdAt||0);
     return Number(x.updatedAt||x.createdAt||0)>rt;
   });
   if(needPush.length)await cloudUpsert(bucket,needPush);

   if(bucket==='requests')localSave(REQUEST_STORE_KEY,DATA.requests);
   if(bucket==='movements')localSave(MOVEMENT_STORE_KEY,DATA.movements);
   if(bucket==='ots')localSave(OT_STORE_KEY,DATA.ots);
   if(bucket==='employees')localSave(EMPLOYEE_STORE_KEY,DATA.employees); if(bucket==='ot_requests')localSave(OT_REQUEST_STORE_KEY,DATA.otRequests);

   updateCloudSnapshots();
   CLOUD_STATE.lastSync=Date.now();
   CLOUD_OK=true;
   cloudSetStatus('online');
   return true;
 }catch(e){
   CLOUD_OK=false;
   CLOUD_STATE.error=String(e?.message||e);
   cloudSetStatus('offline',CLOUD_STATE.error);
   console.warn('[F&B Manpower Cloud]',bucket,e);
   return false;
 }finally{
   CLOUD_BUSY[bucket]=false;
 }
}

const NORMAL_SHIFT_HOURS=9;   // 07:00-16:00 = 9 clock hours
const BREAK_HOURS=1;          // standard break inside the 9-hour shift
const REGULAR_WORK_HOURS=NORMAL_SHIFT_HOURS-BREAK_HOURS; // 8 paid/worked hours

 {id:"morning",label:"เช้า / Breakfast"},

];

function normalizeISODate(v){
 if(!v)return todayISO();
 if(/^\d{4}-\d{2}-\d{2}$/.test(v))return v;
 const d=new Date(v);
 return Number.isNaN(d.getTime())?todayISO():d.toISOString().slice(0,10);
}

function sumMovementStats(list){
 const people=list.length;
 const worked=list.reduce((a,x)=>a+(Number.isFinite(+x.workedHours)?+x.workedHours:movementWorked(x.start||"09:00",x.end||"15:00")),0);
 const ot=list.reduce((a,x)=>a+(Number.isFinite(+x.otHours)?+x.otHours:movementOT(x.start||"09:00",x.end||"15:00")),0);
 const otAmount=list.reduce((a,x)=>a+(Number.isFinite(+x.otAmount)?+x.otAmount:movementOTAmount(x.start||"09:00",x.end||"15:00",Number.isFinite(+x.otRate)?+x.otRate:DATA.otRate)),0);
 const destinations=new Set(list.map(x=>`${x.toHotel}||${x.toOutlet}`));
 const rounds={morning:0,lunch:0,afternoon:0,evening:0};
 list.forEach(x=>{if(rounds[x.serviceRound]!==undefined)rounds[x.serviceRound]++});
 return {people,worked,ot,otAmount,destinations:destinations.size,rounds};
}

function employeeDayRecord(e,date){
 const ck=attendanceKey(e?.id,date),vCloud=DATA.attendance?.[ck];
 const v=vCloud!==undefined?vCloud:e?.statusByDate?.[date];
 if(typeof v==='string') return {status:v,type:v==='leave'?'other':null,attendance:null,actualIn:'',actualOut:'',note:''};
 if(v&&typeof v==='object') return {
   status:v.status||'working',
   type:v.type||null,
   attendance:v.attendance||null,
   actualIn:v.actualIn||'',
   actualOut:v.actualOut||'',
   note:v.note||''
 };
 return {status:e?.defaultStatus||'working',type:null,attendance:null,actualIn:'',actualOut:'',note:''};
}
function employeeStatusOnDate(e,date){
 const r=employeeDayRecord(e,date);
 return {status:r.status,type:r.type};
}
function attendanceLabel(a){
 return ({present:'มาทำงานจริง',late:'มาสาย',absent:'ไม่มาทำงาน',null:'ยังไม่เช็ก'})[a] || 'ยังไม่เช็ก';
}
function effectiveEmployeeShift(e,date){
 const r=employeeDayRecord(e,date);
 const start=r.actualIn||e.shiftStart||'07:00';
 const end=r.actualOut||e.shiftEnd||'16:00';
 return {start,end,record:r};
}
function leaveTypeLabel(t){return ({holiday:"วันหยุดนักขัตฤกษ์",annual:"ลาพักร้อน",personal:"ลากิจ",sick:"ลาป่วย",other:"ลาอื่นๆ"})[t]||"ลา"}
function outletEmployees(hotel,outlet){return DATA.employees.filter(e=>e.hotel===hotel&&e.outlet===outlet)}
function intervalOverlapMinutes(start1,end1,start2,end2){
 const a=timeMinutes(start1), b=timeMinutes(end1), c=timeMinutes(start2), d=timeMinutes(end2);
 const aa=b<=a?b+1440:b, cc=d<=c?d+1440:d;
 return Math.max(0, Math.min(aa,cc)-Math.max(a,c));
}
function intervalContains(startOuter,endOuter,startInner,endInner){
 const oS=timeMinutes(startOuter),oE=timeMinutes(endOuter),iS=timeMinutes(startInner),iE=timeMinutes(endInner);
 const oo=oE<=oS?oE+1440:oE, ii=iE<=iS?iE+1440:iE;
 return oS<=iS && oo>=ii;
}
function movementOverlapsPeriod(m,date,start,end,excludeRequestId=null){
 if(!m||m.date!==date||m.requestId===excludeRequestId)return false;
 return intervalOverlapMinutes(m.start||'00:00',m.end||'00:00',start,end)>0;
}
function hasExplicitDailyStatus(e,date){return !!(e?.statusByDate && Object.prototype.hasOwnProperty.call(e.statusByDate,date));}
function helperEligibility(e,date,start,end,requestId,destHotel,destOutlet){
 const st=employeeStatusOnDate(e,date);
 if(st.status==='off')return {ok:false,reason:'หยุด'};
 if(st.status==='leave')return {ok:false,reason:leaveTypeLabel(st.type)};
 if(e.hotel===destHotel&&e.outlet===destOutlet)return {ok:false,reason:'เป็นพนักงานต้นสังกัดของปลายทาง'};
 const hs=e.shiftStart||'07:00',he=e.shiftEnd||'16:00';
 if(intervalOverlapMinutes(hs,he,start,end)>0)return {ok:false,reason:`เวลางานหลัก ${hs}-${he} ทับช่วงช่วย`};
 if(movementConflict(e.id,date,start,end,requestId))return {ok:false,reason:'มีงานช่วยอื่นซ้อนเวลา'};
 return {ok:true,reason:'พร้อมส่ง'};
}
function manpowerSnapshot(hotel,outlet,date,start='',end='',excludeRequestId=null){
 if(!outlet){
   const outs=(DATA.hotels[hotel]?.outlets||[]).map(o=>o.id);
   const list=outs.map(o=>manpowerSnapshot(hotel,o,date,start,end,excludeRequestId));
   const stat={total:0,scheduledWorking:0,working:0,actualPresent:0,unconfirmed:0,off:0,leave:0,holiday:0,annual:0,personal:0,sick:0,other:0,away:0,incoming:0,availableToSend:0,onDutyFull:0,partial:0,confirmed:0,remaining:0};
   list.forEach(s=>Object.keys(stat).forEach(k=>stat[k]+=Number(s[k]||0)));
   stat.incoming=DATA.movements.filter(m=>m.toHotel===hotel&&movementOverlapsPeriod(m,date,start,end,excludeRequestId)).length;
   stat.remaining=stat.availableToSend;
   return stat;
 }
 const people=outletEmployees(hotel,outlet);
 const stat={total:people.length,scheduledWorking:0,working:0,actualPresent:0,unconfirmed:0,off:0,leave:0,holiday:0,annual:0,personal:0,sick:0,other:0,away:0,incoming:0,availableToSend:0,onDutyFull:0,partial:0,confirmed:0,remaining:0};
 const period=!!(start&&end);
 people.forEach(e=>{
   const s=employeeStatusOnDate(e,date), r=employeeDayRecord(e,date), explicit=hasExplicitDailyStatus(e,date);
   if(explicit)stat.confirmed++;
   if(s.status==='off')stat.off++;
   else if(s.status==='leave'){stat.leave++;stat[s.type||'other']=(stat[s.type||'other']||0)+1;}
   else{
     stat.scheduledWorking++;
     const actualKnown=r.attendance==='present'||r.attendance==='late';
     const actualAbsent=r.attendance==='absent';
     if(actualAbsent)return;
     if(actualKnown)stat.actualPresent++;
     stat.working++;
     if(!explicit||!r.attendance)stat.unconfirmed++;
   }
 });
 if(period){
   people.forEach(e=>{
     const r=employeeDayRecord(e,date); if(r.status!=='working'||r.attendance==='absent')return;
     const shift=effectiveEmployeeShift(e,date), overlapHome=intervalOverlapMinutes(shift.start,shift.end,start,end)>0, covers=intervalContains(shift.start,shift.end,start,end);
     const outgoing=DATA.movements.some(m=>m.code===e.id&&movementOverlapsPeriod(m,date,start,end,excludeRequestId));
     if(outgoing)stat.away++;
     if(!outgoing&&!overlapHome)stat.availableToSend++;
     if(!outgoing&&covers)stat.onDutyFull++;
     if(!outgoing&&overlapHome&&!covers)stat.partial++;
   });
   stat.incoming=DATA.movements.filter(m=>m.toHotel===hotel&&m.toOutlet===outlet&&movementOverlapsPeriod(m,date,start,end,excludeRequestId)).length;
   stat.remaining=stat.availableToSend;
 }else stat.remaining=stat.working;
 return stat;
}

function liveOutletStatus(hotel,outlet,date){
 const people=outletEmployees(hotel,outlet),sentCodes=new Set(DATA.movements.filter(m=>m.fromHotel===hotel&&m.fromOutlet===outlet&&m.date===date).map(m=>m.code));
 const stat={total:people.length,working:0,present:0,off:0,leave:0,unconfirmed:0,sent:sentCodes.size,workingNames:[],presentNames:[],offNames:[],leaveNames:[],unconfirmedNames:[]};
 people.forEach(e=>{const r=employeeDayRecord(e,date);if(r.status==='off'){stat.off++;stat.offNames.push(e.name);return;}if(r.status==='leave'){stat.leave++;stat.leaveNames.push(`${e.name} (${leaveTypeLabel(r.type)})`);return;}stat.working++;stat.workingNames.push(e.name);if(r.attendance==='present'||r.attendance==='late'){stat.present++;stat.presentNames.push(`${e.name}${r.attendance==='late'?' (มาสาย)':''}`)}else{stat.unconfirmed++;stat.unconfirmedNames.push(e.name)}});return stat;
}

function movementOTFromHome(e,start,end){
 const hs=timeMinutes(e?.shiftStart||'07:00'),he=timeMinutes(e?.shiftEnd||'16:00');
 const ms=timeMinutes(start),me=timeMinutes(end);
 const overlap=Math.max(0,Math.min(he,me)-Math.max(hs,ms));
 const total=Math.max(0,me-ms);
 return +(Math.max(0,total-overlap)/60).toFixed(2);
}

let movementSelectedCodes = new Set();

function fnbEsc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function activeRequestList(){
 return DATA.requests.filter(x=>x && x.status!=="deleted" && !x.deletedAt);
}
function requestAssignedCodes(rq){
 return Array.isArray(rq?.assignedCodes)?rq.assignedCodes:[];
}
function requestMovements(rq){
 return DATA.movements.filter(x=>x.requestId===rq.id);
}
function requestSourceBreakdown(rq){
 const rows=requestMovements(rq);
 const map=new Map();
 rows.forEach(x=>{
   const key=`${x.fromHotel}||${x.fromOutlet}`;
   const item=map.get(key)||{hotel:x.fromHotel,outlet:x.fromOutlet,people:0,names:[]};
   item.people++;
   item.names.push(x.name||x.code||"-");
   map.set(key,item);
 });
 if(!map.size && rq?.fromHotel){
   const key=`${rq.fromHotel}||${rq.fromOutlet}`;
   map.set(key,{hotel:rq.fromHotel,outlet:rq.fromOutlet,people:0,names:[]});
 }
 return [...map.values()];
}

 if(!assigned){

 }
 return `<div class="v23-request-source"><b>ต้นทางที่จัดจริง • ${rows.length} จุด</b>${

 }</div>`;

function requestDestinationLabel(rq){ return hotelName(rq?.toHotel); }
function requestTypeLabel(rq){return String(rq?.requestType||((Number(rq?.casualPeople||0)>0&&Number(rq?.qty||0)===0)?"CASUAL":"TRANSFER"))==="CASUAL"?"ขอ Casual":"ขอพนักงานจากที่อื่น";}
function requestIsCasual(rq){return requestTypeLabel(rq)==="ขอ Casual";}
function canRejectRequest(rq){
 const noAssigned=requestAssignedCodes(rq).length===0 && requestMovements(rq).length===0;
 const statusOK=rq && ["pending","accepted"].includes(rq.status);
 return !!(noAssigned && statusOK && v21IsApprover());
}
function canCancelRequest(rq){
 const noAssigned=requestAssignedCodes(rq).length===0 && requestMovements(rq).length===0;
 const statusOK=rq && ["pending","accepted","rejected"].includes(rq.status);
 const ownerOK=rq?.createdBy===v21CurrentUser?.id;
 const roleOK=v21HasLevel('supervisor');
 return !!(noAssigned && statusOK && (ownerOK||roleOK));
}
function canCloseRequest(rq){
 const owner=rq?.createdBy===v21CurrentUser?.id;
 return !!(rq && rq.status==="assigned" && owner && requestAssignedCodes(rq).length>=Number(rq.qty||0) && v21HasLevel('manager'));
}
function canHideDoneRequest(rq){
 return !!(rq && rq.status==="done" && v21HasLevel('manager'));
}
function canDeleteRequest(rq){ return canCancelRequest(rq); }
function timeMinutes(v){const [h,m]=(v||'00:00').split(':').map(Number);return h*60+m}
function movementConflict(code,date,start,end,requestId){
 const s=timeMinutes(start), e=timeMinutes(end);
 return DATA.movements.some(m=>m.code===code && m.date===date && m.requestId!==requestId && Math.max(s,timeMinutes(m.start)) < Math.min(e,timeMinutes(m.end)));
}
function filteredEmployeesForMovement(){
 const q=(document.getElementById("m_empSearch")?.value||"").trim().toLowerCase();
 const activeRq=window.pendingRequestId?DATA.requests.find(x=>x.id===window.pendingRequestId):null;
 const sourceHotel=activeRq?.fromHotel||null, sourceOutlet=activeRq?.fromOutlet||null;
 const date=activeRq?.date||todayISO(), start=document.getElementById('m_helpStart')?.value||activeRq?.start||'15:00', end=document.getElementById('m_helpEnd')?.value||activeRq?.end||'20:00';
 const destHotel=activeRq?.toHotel||document.getElementById('m_toHotel')?.value, destOutlet=activeRq?.toOutlet||null;
 const scope=document.getElementById('m_empScope')?.value||'eligible';
 const all=DATA.employees.map((e,i)=>({e,i,elig:helperEligibility(e,date,start,end,activeRq?.id||null,destHotel,destOutlet)})).filter(x=>{

   if(q&&!hay.includes(q))return false;
   return true;
 });
 const eligible=all.filter(x=>x.elig.ok);
 // Keep the names visible when nobody is currently eligible; ineligible rows remain disabled with a reason.
 return scope==='eligible' ? (eligible.length ? eligible : all) : all;
}

function v28SearchEmployees(term,date,start,end,activeRq,destHotel,destOutlet){
 const q=String(term||'').trim().toLowerCase();
 if(!q)return [];
 const selected=new Set(movementSelectedCodes);
 const sourceHotel=activeRq?.fromHotel||null, sourceOutlet=activeRq?.fromOutlet||null;
 const rows=DATA.employees.map((e,i)=>{
   const hay=[e.name,e.id,e.role,e.hotel,e.outlet,outletName(e.hotel,e.outlet),hotelName(e.hotel)].join(' ').toLowerCase();
   if(!hay.includes(q))return null;
   const elig=helperEligibility(e,date,start,end,activeRq?.id||null,destHotel,destOutlet);
   return {e,i,elig,already:selected.has(e.id)};
 }).filter(Boolean);
 rows.sort((a,b)=>{
   if(a.already!==b.already)return a.already?-1:1;
   if(a.elig.ok!==b.elig.ok)return a.elig.ok?-1:1;
   const qa=a.e.name.toLowerCase(), qb=b.e.name.toLowerCase();
   const as=qa.startsWith(q), bs=qb.startsWith(q);
   if(as!==bs)return as?-1:1;
   return qa.localeCompare(qb,'th');
 });
 return rows.slice(0,40);
}

let v21CurrentUser=(()=>{try{return JSON.parse(sessionStorage.getItem('fb_manpower_session')||'null')}catch{return null}})();
function v21UserPosition(u=v21CurrentUser){return String(u?.position||u?.roleLabel||'').trim().toUpperCase()}
function v21IsManagerPosition(u=v21CurrentUser){const p=v21UserPosition(u);return /(?:MANAGER|MGR)$/.test(p)}
function v21EffectiveRoleKey(u=v21CurrentUser){if(!u)return 'staff';if(['admin','superadmin'].includes(u.role))return u.role;return v21IsManagerPosition(u)?'manager':(u.role||'staff')}
function v21CanRole(role,needed,u=v21CurrentUser){const effective=u?v21EffectiveRoleKey(u):role;return (V21_ROLE_ORDER[effective]||0)>=(V21_ROLE_ORDER[needed]||99)}
function v21HasLevel(needed,u=v21CurrentUser){return v21CanRole(v21EffectiveRoleKey(u),needed,u)}
function v21CanPage(p){if(!v21CurrentUser)return p==='login';if(p==='select')return v21CanHotelSwitch();return (V21_ALLOWED[p]||[]).includes(v21EffectiveRoleKey())}
function v21CanHotelSwitch(){return !!v21CurrentUser && v21HasLevel('manager')}
function v21ApproverMap(){try{return JSON.parse(localStorage.getItem('fb_manpower_approvers')||'{}')}catch{return {}}}
function v21IsApprover(){if(!v21CurrentUser)return false;const m=v21ApproverMap();return m[v21CurrentUser.id]!==undefined?!!m[v21CurrentUser.id]:(!!v21CurrentUser.canApprove||v21IsManagerPosition(v21CurrentUser))}
function v21SetApprover(id,on){const m=v21ApproverMap();m[id]=!!on;localStorage.setItem('fb_manpower_approvers',JSON.stringify(m));if(v21CurrentUser?.id===id)v21CurrentUser.canApprove=!!on;v21Audit('SET_APPROVER',`${id} • ${on?'เปิด':'ปิด'}สิทธิ์ผู้มีอำนาจอนุมัติ`)}

function otV35UpdateTotals(){

   <div class="ot-print-notes">${casualOnly?'* Casual จ้างตามจำนวนชั่วโมงและอัตราที่ระบุในแต่ละงาน<br>':'* Casual จ้างตามจำนวนชั่วโมงและอัตราที่ระบุในแต่ละงาน<br>* O.T. ใช้อัตราตามที่ระบุในแต่ละงาน<br>'}${esc(d.manpowerNote||'')}${sourceNote?`<br>${sourceNote}`:''}</div>
   <div class="ot-print-approval">จึงเรียนมาเพื่อโปรดพิจารณาอนุมัติ<div class="ot-print-sign-grid"><div>ขอแสดงความนับถือ<br><br>ลงชื่อ ........................................................<br>ผู้จัดทำ / Restaurant Manager</div><div>ลงชื่อ ........................................................<br>ผู้มีอำนาจอนุมัติ</div></div></div>

function otV35ShowPrint(id){const f=(DATA.otRequests||[]).find(x=>x.id===id)||window.otV35DraftSaved;if(!f)return toast('ไม่พบใบขอ OT');let host=document.getElementById('otV35PrintHost');if(!host){host=document.createElement('div');host.id='otV35PrintHost';document.body.appendChild(host)}host.innerHTML=otV35PrintHtml(f);host.className='ot-print-host';document.body.classList.add('printing-ot');const cleanup=()=>{host.innerHTML='';document.body.classList.remove('printing-ot');window.removeEventListener('afterprint',cleanup)};window.addEventListener('afterprint',cleanup);requestAnimationFrame(()=>window.print())}

// Small cloud bridge: tries to persist V35 OT documents in a dedicated bucket without breaking the app if the SQL policy is not deployed yet.
async function otV35CloudUpsert(rec){try{
 const row={bucket:'ot_requests',item_id:String(rec.id),payload:rec,updated_at:new Date(rec.createdAt||Date.now()).toISOString()};
 const u=FNB_CLOUD.url+'/rest/v1/'+FNB_CLOUD.table+'?on_conflict=bucket,item_id';
 const r=await fetch(u,{method:'POST',headers:cloudHeaders(true),body:JSON.stringify([row]),cache:'no-store'});
 if(!r.ok)throw new Error(await r.text());
 return true;
 }catch(e){console.warn('[OT V35 cloud]',e);return false}}
async function otV35CloudLoad(){try{
 const u=FNB_CLOUD.url+'/rest/v1/'+FNB_CLOUD.table+'?select=item_id,payload,updated_at&bucket=eq.ot_requests';
 const r=await fetch(u,{headers:cloudHeaders(),cache:'no-store'}); if(!r.ok)return false; const rows=await r.json();
 const local=new Map((DATA.otRequests||[]).map(x=>[String(x.id),x])); rows.forEach(x=>{if(x.payload&&!local.has(String(x.item_id)))local.set(String(x.item_id),x.payload)});
 DATA.otRequests=Array.from(local.values()).sort((a,b)=>Number(b.createdAt||0)-Number(a.createdAt||0));localStorage.setItem(OT_REQUEST_STORE_KEY,JSON.stringify(DATA.otRequests));if(page==='ot')render();return true;
 }catch(e){return false}}
window.otV35CloudLoad=otV35CloudLoad;
const _oldOtSaveLocal=otV35SaveLocal; otV35SaveLocal=function(rec){_oldOtSaveLocal(rec);otV35CloudUpsert(rec)};
setTimeout(()=>otV35CloudLoad(),1500);
